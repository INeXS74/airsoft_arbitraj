<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Audio Airsoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --background-light: #ecf0f1;
            --text-color: #2c3e50;
            --button-text-color: white;
            --disabled-color: #bdc3c7;
            --border-color: #95a5a6;
        }

        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* MODIFICAT: space-between poate împinge elementele afară. Folosim flex-start cu gap */
            justify-content: flex-start; 
            min-height: 100svh; 
            margin: 0;
            background: linear-gradient(to right bottom, #f0f4f7, #dae4ea);
            color: var(--text-color);
            padding: 10px;
            box-sizing: border-box;
            /* MODIFICAT: Permitem scroll pe verticală dacă nu încape conținutul */
            overflow-y: auto; 
            user-select: none;
            gap: 10px; /* Spațiu consistent între toate elementele majore */
        }

        .header-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            flex-shrink: 0; 
        }

        .logo {
            max-width: 100px; /* Ușor micșorat pentru a salva spațiu */
            height: auto;
            margin-bottom: 5px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        
        h3 {
             margin: 0; 
             opacity: 0.8;
             font-size: 1.2rem;
        }

        /* --- CRONOMETRU PRINCIPAL --- */
        .timer-display {
            font-family: 'Roboto', monospace;
            font-weight: 900;
            /* Ajustat font-size pentru a fi sigur că nu e prea masiv */
            font-size: clamp(3.5em, 15vw, 6em); 
            color: var(--text-color);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 5px 0; /* Padding redus */
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 95%;
            max-width: 600px;
            border: 4px solid transparent;
            line-height: 1.1;
            flex-shrink: 0; /* Nu lăsa cronometrul să se strivească */
        }
        
        .timer-display.prep {
            color: var(--warning-color);
            border-color: var(--warning-color);
            font-size: clamp(2em, 8vw, 4em);
        }
        
        .timer-display.running {
            color: var(--success-color);
            border-color: var(--success-color);
        }
        
        .timer-display.stopped {
            color: var(--secondary-color);
            border-color: var(--secondary-color);
            background-color: #fff5f5;
        }

        /* --- BUTOANE --- */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            /* Aceasta va permite butoanelor să ocupe spațiul rămas, dar nu forțat */
            flex-grow: 1; 
            min-height: 200px; /* Înălțime minimă garantată */
            justify-content: center;
            align-items: center;
        }

        button {
            cursor: pointer;
            border-radius: 10px; /* Ușor rotunjite, arată mai bine dacă nu sunt perfect pătrate */
            border: 2px solid var(--border-color);
            color: var(--button-text-color);
            font-weight: 700;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            text-transform: uppercase;
            outline: none;
            /* MODIFICAT: aspect-ratio scos pentru a permite flexibilitate dacă ecranul e scurt */
            width: 100%;
            height: 100%; /* Încearcă să umple containerul */
            max-height: 350px; /* Dar nu mai mult de atât */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: clamp(1.2em, 5vmin, 2.2em); 
            line-height: 1.2;
            -webkit-tap-highlight-color: transparent;
            padding: 10px;
        }

        button:active:not(:disabled) {
            transform: scale(0.96);
        }

        button:disabled {
            background-color: var(--disabled-color) !important;
            cursor: not-allowed;
            border-color: #cccccc;
            box-shadow: none;
        }

        #startBtn { background: linear-gradient(145deg, var(--success-color), #27ae60); }
        #hornBtn { background: linear-gradient(145deg, var(--secondary-color), #c0392b); }

        /* --- ORA START/FINAL --- */
        .real-time-display {
            width: 100%;
            max-width: 600px;
            text-align: center;
            font-family: 'Roboto', monospace;
            font-size: clamp(0.9em, 3.5vw, 1.2em);
            font-weight: 700;
            color: var(--text-color);
            flex-shrink: 0;
            display: flex;
            justify-content: space-around; /* Le punem pe același rând să salvăm spațiu vertical */
            gap: 10px;
        }
        .real-time-display div {
            padding: 5px 10px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 5px;
            flex: 1; /* Ocupă spațiu egal */
        }
        .real-time-display #startTimeDisplay { color: var(--success-color); border: 1px solid var(--success-color); }
        .real-time-display #endTimeDisplay { color: var(--secondary-color); border: 1px solid var(--secondary-color); }

        .status-message {
            font-size: clamp(0.9em, 3vw, 1.1em);
            font-weight: 700;
            color: var(--text-color);
            min-height: 1.5em;
            text-align: center;
            flex-shrink: 0;
            padding-bottom: 10px;
        }
        .status-message.error { color: var(--secondary-color); }
        .status-message.success { color: var(--success-color); }

        /* Ajustări pentru Landscape */
        @media (orientation: landscape) {
            body {
                flex-direction: row; 
                align-items: center;
                justify-content: center;
                padding: 10px;
                overflow-y: auto; /* Permite scroll și în landscape */
            }
            .header-container { display: none; } /* Ascunde headerul în landscape */
            
            .left-column {
                display: flex;
                flex-direction: column;
                width: 45%;
                align-items: center;
                justify-content: center;
                gap: 10px;
            }
            
            .right-column {
                display: flex;
                flex-direction: column;
                width: 50%;
                height: 90vh;
                justify-content: center;
            }

            .timer-display {
                font-size: clamp(3em, 12vh, 6em);
                width: 100%;
            }

            .real-time-display {
                flex-direction: column;
                gap: 5px;
            }
            
            .button-container {
                flex-direction: row;
                width: 100%;
                max-width: none;
                height: 100%;
                gap: 10px;
            }
            button {
                width: 48%;
                height: 100%;
                max-height: none;
            }
        }
        
        /* Pentru ecrane mici Portrait, ascundem logo-ul să facem loc butoanelor */
        @media (orientation: portrait) and (max-height: 700px) {
            .logo { display: none; }
        }
    </style>
</head>
<body>
    
    <!-- WRAPPER PENTRU LANDSCAPE - doar structură logică -->
    <div style="display:contents" class="portrait-layout">
        
        <!-- HEADER CU LOGO -->
        <div class="header-container">
            <img src="logo_federatie.png" alt="Logo" class="logo" onerror="this.style.display='none'">
            <h3>TIMER SPEEDSOFTRO</h3>
        </div>

        <!-- AUDIO PLAYER ASCUNS (.mp3) -->
        <!-- ASIGURĂ-TE CĂ NUMELE FIȘIERULUI AICI ESTE CORECT! Ai zis că e wav sau mp3? Codul tău de mai sus avea mp3. -->
        <audio id="airsoftAudio" src="competitie_audio.mp3" preload="auto"></audio>

        <!-- CRONOMETRU PRINCIPAL -->
        <div id="timerDisplay" class="timer-display">00:00</div>

        <!-- BUTOANE -->
        <div class="button-container">
            <button id="startBtn">▶️ <br> START</button>
            <button id="hornBtn">🛑 <br> FINAL <br> Repriză</button>
        </div>

        <!-- ORA START/FINAL (CEASURI FIZICE) -->
        <div class="real-time-display">
            <div id="startTimeDisplay">Start: --:--:--</div>
            <div id="endTimeDisplay">Final: --:--:--</div>
        </div>

        <!-- MESAJE STATUS -->
        <div id="statusMessage" class="status-message">Se încarcă sistemul...</div>
        
    </div>

    <script>
        const audioPlayer = document.getElementById('airsoftAudio');
        const startButton = document.getElementById('startBtn');
        const hornButton = document.getElementById('hornBtn');
        const statusMessage = document.getElementById('statusMessage');
        const timerDisplay = document.getElementById('timerDisplay');
        const startTimeDisplay = document.getElementById('startTimeDisplay');
        const endTimeDisplay = document.getElementById('endTimeDisplay');

        // --- CONFIGURĂRI IMPORTANTE ---
        const END_SEGMENT_LENGTH_SECONDS = 5;      
        const START_DELAY_SECONDS = 15;             
        const MAX_GAME_DURATION_SECONDS = 3 * 60;   
        
        let audioDuration = 0;
        let animationFrameId; 
        let isGameRunning = false; 

        let actualStartTime = null; 
        let actualEndTime = null;   
        let hasActualGameStarted = false; 

        function formatTime(seconds) {
            if (seconds < 0) seconds = 0;
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function formatRealTime(date) {
            if (!date) return '--:--:--';
            const h = date.getHours().toString().padStart(2, '0');
            const m = date.getMinutes().toString().padStart(2, '0');
            const s = date.getSeconds().toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function updateStatus(message, type = '') {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
        }

        function requestFullscreen() {
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
        }

        function gameLoop() {
            if (!isGameRunning) return;

            const currentTime = audioPlayer.currentTime;
            let gameTimeForDisplay;

            if (currentTime < START_DELAY_SECONDS) {
                const prepTimeLeft = Math.ceil(START_DELAY_SECONDS - currentTime);
                timerDisplay.textContent = `PREGĂTIRE: ${prepTimeLeft}`;
                timerDisplay.className = 'timer-display prep';
                hasActualGameStarted = false; 
                animationFrameId = requestAnimationFrame(gameLoop); 
                return; 
            } 
            
            if (!hasActualGameStarted && currentTime >= START_DELAY_SECONDS) {
                actualStartTime = new Date(); 
                startTimeDisplay.textContent = "Start: " + formatRealTime(actualStartTime);
                hasActualGameStarted = true; 
            }

            gameTimeForDisplay = currentTime - START_DELAY_SECONDS;

            if (gameTimeForDisplay >= MAX_GAME_DURATION_SECONDS) {
                gameTimeForDisplay = MAX_GAME_DURATION_SECONDS;
                if (isGameRunning) { 
                    isGameRunning = false; 
                    cancelAnimationFrame(animationFrameId);
                    timerDisplay.textContent = formatTime(MAX_GAME_DURATION_SECONDS);
                    timerDisplay.className = 'timer-display stopped';
                    updateStatus("Timp regulamentar atins (3:00). Audio continuă.", "error");

                    if (!actualEndTime) { 
                        actualEndTime = new Date();
                        endTimeDisplay.textContent = "Final: " + formatRealTime(actualEndTime);
                    }
                    return; 
                }
            }

            timerDisplay.textContent = formatTime(gameTimeForDisplay);
            timerDisplay.className = 'timer-display running';

            animationFrameId = requestAnimationFrame(gameLoop); 
        }

        audioPlayer.onloadedmetadata = () => {
            audioDuration = audioPlayer.duration;
            startButton.disabled = false;
            hornButton.disabled = false;
            updateStatus("Sistem pregătit. Apasă START.");
        };

        audioPlayer.onerror = () => {
            updateStatus("EROARE: Nu găsesc 'competitie_audio.mp3'", "error");
        };

        startButton.addEventListener('click', () => {
            requestFullscreen(); 
            
            isGameRunning = true;
            audioPlayer.currentTime = 0;
            actualStartTime = null; 
            actualEndTime = null; 
            hasActualGameStarted = false; 
            startTimeDisplay.textContent = "Start: --:--:--"; 
            endTimeDisplay.textContent = "Final: --:--:--";
            
            audioPlayer.play().then(() => {
                updateStatus("Joc în desfășurare...", "success");
                cancelAnimationFrame(animationFrameId);
                gameLoop(); 
            }).catch(e => updateStatus("Eroare redare: " + e, "error"));
        });

        hornButton.addEventListener('click', () => {
            if (audioDuration > 0 && isGameRunning) {
                isGameRunning = false; 
                cancelAnimationFrame(animationFrameId);
                audioPlayer.pause(); 

                actualEndTime = new Date();
                endTimeDisplay.textContent = "Final: " + formatRealTime(actualEndTime);

                const currentAudioTime = audioPlayer.currentTime;

                if (currentAudioTime < START_DELAY_SECONDS) {
                    timerDisplay.textContent = "00:00"; 
                    timerDisplay.className = 'timer-display stopped';
                    updateStatus("Pregătire oprită. Repriză ANULATĂ.", "error");
                    
                    if (!hasActualGameStarted) {
                        startTimeDisplay.textContent = "Start: --:--:--";
                    }
                } else {
                    let finalGameTime = currentAudioTime - START_DELAY_SECONDS;
                    if (finalGameTime > MAX_GAME_DURATION_SECONDS) {
                        finalGameTime = MAX_GAME_DURATION_SECONDS;
                    }

                    timerDisplay.textContent = formatTime(finalGameTime);
                    timerDisplay.className = 'timer-display stopped';
                    updateStatus("Joc oprit manual!", "error");

                    const hornStartTime = Math.max(0, audioDuration - END_SEGMENT_LENGTH_SECONDS);
                    audioPlayer.currentTime = hornStartTime;
                    audioPlayer.play();

                    setTimeout(() => {
                        audioPlayer.pause();
                    }, END_SEGMENT_LENGTH_SECONDS * 1000);
                }
            }
        });

        audioPlayer.onended = () => {
            isGameRunning = false;
            cancelAnimationFrame(animationFrameId);
            
            if (!actualEndTime) { 
                actualEndTime = new Date();
                endTimeDisplay.textContent = "Final: " + formatRealTime(actualEndTime);
            }

            if (!hasActualGameStarted) { 
                timerDisplay.textContent = "00:00";
                timerDisplay.className = 'timer-display stopped';
                updateStatus("Repriză ANULATĂ (Audio s-a terminat în pregătire).", "error");
                startTimeDisplay.textContent = "Start: --:--:--";
            } else { 
                let totalGameTime = audioDuration - START_DELAY_SECONDS;
                if (totalGameTime > MAX_GAME_DURATION_SECONDS) totalGameTime = MAX_GAME_DURATION_SECONDS;

                timerDisplay.textContent = formatTime(totalGameTime);
                timerDisplay.className = 'timer-display stopped';
                updateStatus("Timp expirat (Final natural).", "error");
            }
        };
    </script>
</body>
</html>
